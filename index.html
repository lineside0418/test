<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vapor-Liquid Equilibrium Simulator - Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* ========================================
       ベーススタイル・デザイン変数
       Appleライク・モダンBento UI
       ======================================== */
    :root {
        --bg-color: #000000;
        --card-bg: rgba(28, 28, 30, 0.6);
        --card-border: rgba(255, 255, 255, 0.1);
        --accent-blue: #0A84FF;
        --accent-green: #30D158;
        --accent-orange: #FF9F0A;
        --text-main: #F5F5F7;
        --text-sub: #86868B;
        --font-family: 'Inter', 'Noto Sans JP', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        background-image: 
            radial-gradient(circle at 15% 50%, rgba(10, 132, 255, 0.15), transparent 25%),
            radial-gradient(circle at 85% 30%, rgba(48, 209, 88, 0.15), transparent 25%);
        color: var(--text-main);
        font-family: var(--font-family);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
    }

    .dashboard {
        display: grid;
        /* 少しコンパクトに画面に収まるように調整 */
        grid-template-columns: 280px 360px;
        grid-template-rows: auto auto;
        gap: 20px;
        max-width: 900px;
    }

    /* Bentoカードの共通スタイル */
    .bento-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        padding: 24px;
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
    }

    .card-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-sub);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* ========================================
       シミュレータ領域
       ======================================== */
    .sim-card {
        grid-column: 1 / 2;
        grid-row: 1 / 3;
        align-items: center;
    }

    .canvas-container {
        position: relative;
        width: 220px;
        height: 400px; /* 縦長を抑えて画面に収まるように変更 */
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 100%);
        border: 2px solid rgba(255,255,255,0.1);
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    /* ========================================
       コントロールパネル
       ======================================== */
    .controls-card {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
        gap: 16px;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .control-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .control-label {
        font-size: 14px;
        font-weight: 500;
    }

    .control-value {
        font-size: 15px;
        font-weight: 700;
        color: var(--accent-blue);
        font-variant-numeric: tabular-nums;
    }

    /* カスタムスライダー */
    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        margin-top: 4px;
        margin-bottom: 4px;
    }
    input[type=range]:focus {
        outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 6px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        transition: background 0.2s;
    }
    input[type=range]:hover::-webkit-slider-runnable-track {
        background: rgba(255, 255, 255, 0.25);
    }
    input[type=range]::-webkit-slider-thumb {
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -7px;
        transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:active {
        transform: scale(1.1);
    }

    /* カスタムセレクトボックス */
    select {
        appearance: none;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 500;
        border-radius: 12px;
        outline: none;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
    }
    select:hover {
        background: rgba(255, 255, 255, 0.15);
    }
    select:focus {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.2);
    }
    select option {
        background: #1c1c1e;
        color: white;
    }

    /* ========================================
       メトリクス（統計・情報）パネル
       ======================================== */
    .metrics-card {
        grid-column: 2 / 3;
        grid-row: 2 / 3;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .metric-item {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .metric-label {
        font-size: 12px;
        color: var(--text-sub);
        font-weight: 500;
    }

    .metric-value {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
    }

    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        width: fit-content;
        margin-top: 4px;
    }
    .status-evap { background: rgba(255, 159, 10, 0.2); color: var(--accent-orange); }
    .status-cond { background: rgba(48, 209, 88, 0.2); color: var(--accent-green); }
    .status-eq { background: rgba(10, 132, 255, 0.2); color: var(--accent-blue); }

    /* レスポンシブ */
    @media (max-width: 700px) {
        .dashboard {
            grid-template-columns: 1fr;
        }
        .sim-card {
            grid-column: 1 / 2;
            grid-row: auto;
        }
        .controls-card, .metrics-card {
            grid-column: 1 / 2;
            grid-row: auto;
        }
    }
</style>
</head>
<body>

<div class="dashboard">
    <!-- シミュレーション画面 -->
    <div class="bento-card sim-card">
        <div class="card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l3-9 5 18 3-9h5"/></svg>
            Simulation View
        </div>
        <div class="canvas-container">
            <!-- CSSの半分のサイズを論理ピクセルに指定してRetinaディスプレイ対応 -->
            <canvas id="simCanvas" width="440" height="800"></canvas>
        </div>
    </div>

    <!-- コントロールパネル -->
    <div class="bento-card controls-card">
        <div class="card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Parameters
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="control-label">物質 (Substance)</span>
            </div>
            <select id="substanceSelect">
                <option value="water">水 (Water)</option>
                <option value="ethanol">エタノール (Ethanol)</option>
                <option value="diethylether">ジエチルエーテル (Diethyl Ether)</option>
            </select>
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="control-label">温度 (Temperature)</span>
                <span class="control-value" id="tempDisp">25 °C</span>
            </div>
            <input type="range" id="tempSlider" min="-20" max="150" value="25" step="1">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="control-label">ピストン位置 (Volume)</span>
                <span class="control-value" id="volDisp">5.0 L</span>
            </div>
            <input type="range" id="volSlider" min="2" max="10" value="5" step="0.1">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span class="control-label">シミュレーション速度 (Time Speed)</span>
                <span class="control-value" id="speedDisp">1.0x</span>
            </div>
            <input type="range" id="speedSlider" min="0.1" max="5.0" value="1.0" step="0.1">
        </div>
    </div>

    <!-- メトリクスパネル -->
    <div class="bento-card metrics-card">
        <div class="card-title" style="grid-column: 1 / 3;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
            Real-time Metrics
        </div>
        
        <div class="metric-item">
            <span class="metric-label">飽和蒸気圧</span>
            <span class="metric-value" id="vapPresDisp">-- hPa</span>
        </div>
        <div class="metric-item">
            <span class="metric-label">現在気体圧力</span>
            <span class="metric-value" id="curPresDisp">-- hPa</span>
        </div>
        <div class="metric-item" style="grid-column: 1 / 3;">
            <span class="metric-label">気体 / 液体 モル数</span>
            <span class="metric-value" id="molDisp">-- / -- mol</span>
        </div>
        <div class="metric-item" style="grid-column: 1 / 3;">
            <span class="metric-label">状態</span>
            <div id="statusBadge" class="status-badge status-eq">気液平衡</div>
        </div>
    </div>
</div>

<script>
/**
 * ========================================
 * バグ修正・改良版シミュレーションロジック
 * ========================================
 * ・描画スケールと物理容積のスケールを完全統一（突き抜け防止）
 * ・パーティクルのクランプ（めり込み・すり抜け防止）の厳格化
 */

const SUBSTANCES = {
    water: {
        name: "水",
        A: 8.07131, B: 1730.63, C: 233.426,
        colorL: "rgba(10, 132, 255, 0.7)", colorD: "rgba(10, 132, 255, 0.9)"
    },
    ethanol: {
        name: "エタノール",
        A: 8.20417, B: 1642.89, C: 230.300,
        colorL: "rgba(255, 159, 10, 0.7)", colorD: "rgba(255, 159, 10, 0.9)"
    },
    diethylether: {
        name: "ジエチルエーテル",
        A: 6.98685, B: 1064.63, C: 228.000,
        colorL: "rgba(48, 209, 88, 0.7)", colorD: "rgba(48, 209, 88, 0.9)"
    }
};

const R_kPa = 8.31446; // 気体定数 [L·kPa/(mol·K)]
const TOTAL_MOL = 50.0; // 系の総物質量 [mol]
const LIQUID_VOL_PER_MOL = 0.04; // 1molあたりの液体の体積 [L]（シミュレーション用の仮想密度）
const MAX_VOL = 10.0; // 容器の最大容積 [L]

let currentSubstance = SUBSTANCES.water;

let state = {
    tempC: 25,
    tempK: 298.15,
    containerVol: 5.0,
    liquidMol: 25.0,
    gasMol: 25.0,
    timeSpeed: 1.0,
    vaporPressurePa: 0,
    currentPressurePa: 0
};

// ========================================
// DOM要素の取得
// ========================================
const UI = {
    substance: document.getElementById('substanceSelect'),
    temp: document.getElementById('tempSlider'),
    vol: document.getElementById('volSlider'),
    speed: document.getElementById('speedSlider'),
    tempDisp: document.getElementById('tempDisp'),
    volDisp: document.getElementById('volDisp'),
    speedDisp: document.getElementById('speedDisp'),
    vapPresDisp: document.getElementById('vapPresDisp'),
    curPresDisp: document.getElementById('curPresDisp'),
    molDisp: document.getElementById('molDisp'),
    statusBadge: document.getElementById('statusBadge'),
    canvas: document.getElementById('simCanvas')
};
const ctx = UI.canvas.getContext('2d');

const CANVAS_W = 440;
const CANVAS_H = 800; // この高さが10Lに相当する
const PISTON_H = 40;

// ========================================
// パーティクルシステム
// ========================================
class Particle {
    constructor(isGas) {
        this.isGas = isGas;
        this.radius = 6; // Retina対応のため少し大きめ
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.x = CANVAS_W / 2;
        this.y = CANVAS_H / 2;
        this.resetPosition();
    }

    resetPosition() {
        // 描画スケールに合わせて配置
        const liquidVolL = state.liquidMol * LIQUID_VOL_PER_MOL;
        const liquidH = CANVAS_H * (liquidVolL / MAX_VOL);
        const liquidY = CANVAS_H - liquidH;
        
        const pistonBottom = CANVAS_H - (CANVAS_H * (state.containerVol / MAX_VOL));

        if (this.isGas) {
            this.x = this.radius + Math.random() * (CANVAS_W - this.radius * 2);
            // ピストン下面と液面の間で発生
            this.y = pistonBottom + this.radius + Math.random() * (liquidY - pistonBottom - this.radius * 2);
        } else {
            this.x = this.radius + Math.random() * (CANVAS_W - this.radius * 2);
            this.y = liquidY + this.radius + Math.random() * (liquidH - this.radius * 2);
        }
    }

    update(dt, pistonBottom, liquidY) {
        const baseSpeed = Math.sqrt(state.tempK / 298.15) * state.timeSpeed;
        
        if (this.isGas) {
            const speedMultiplier = 16 * baseSpeed;
            this.x += this.vx * speedMultiplier * dt;
            this.y += this.vy * speedMultiplier * dt;

            // X軸の壁反射
            if (this.x < this.radius) { this.x = this.radius; this.vx *= -1; }
            else if (this.x > CANVAS_W - this.radius) { this.x = CANVAS_W - this.radius; this.vx *= -1; }

            // Y軸（ピストン下面と液面）の反射・突き抜け防止を厳密に
            if (this.y < pistonBottom + this.radius) {
                this.y = pistonBottom + this.radius;
                this.vy = Math.abs(this.vy);
            } else if (this.y > liquidY - this.radius) {
                this.y = liquidY - this.radius;
                this.vy = -Math.abs(this.vy);
            }
            // クランプ（急激なスライダー操作対策）
            this.y = Math.max(pistonBottom + this.radius, Math.min(liquidY - this.radius, this.y));

        } else {
            const speedMultiplier = 2 * baseSpeed;
            this.vx += (Math.random() - 0.5) * 3;
            this.vy += (Math.random() - 0.5) * 3;
            this.vx *= 0.95;
            this.vy *= 0.95;

            this.x += this.vx * speedMultiplier * dt;
            this.y += this.vy * speedMultiplier * dt;

            // 液体の中での反射
            if (this.x < this.radius) { this.x = this.radius; this.vx *= -1; }
            else if (this.x > CANVAS_W - this.radius) { this.x = CANVAS_W - this.radius; this.vx *= -1; }

            if (this.y < liquidY + this.radius) { 
                this.y = liquidY + this.radius; 
                this.vy = Math.abs(this.vy); 
            } else if (this.y > CANVAS_H - this.radius) { 
                this.y = CANVAS_H - this.radius; 
                this.vy = -Math.abs(this.vy); 
            }
            this.y = Math.max(liquidY + this.radius, Math.min(CANVAS_H - this.radius, this.y));
        }
    }

    draw(ctx, color) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.isGas ? color.replace("0.9", "0.7") : color;
        ctx.fill();
        
        if (this.isGas) {
            ctx.shadowBlur = 12;
            ctx.shadowColor = color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
}

const PARTICLE_RATIO = 4; // 1molあたりの粒子数
let particles = [];

function syncParticles() {
    const targetGas = Math.floor(state.gasMol * PARTICLE_RATIO);
    const targetLiquid = Math.floor(state.liquidMol * PARTICLE_RATIO);
    
    let currentGas = particles.filter(p => p.isGas).length;
    let currentLiquid = particles.filter(p => !p.isGas).length;

    while (currentGas < targetGas && currentLiquid > 0) {
        const p = particles.find(p => !p.isGas);
        if (p) { p.isGas = true; p.resetPosition(); currentGas++; currentLiquid--; }
    }
    while (currentLiquid < targetLiquid && currentGas > 0) {
        const p = particles.find(p => p.isGas);
        if (p) { p.isGas = false; p.resetPosition(); currentLiquid++; currentGas--; }
    }
}

for (let i = 0; i < TOTAL_MOL * PARTICLE_RATIO; i++) {
    particles.push(new Particle(i < state.gasMol * PARTICLE_RATIO));
}

// ========================================
// ボリューム（ピストン位置）のクランプ
// ピストンが絶対に液面を押し潰さないようにする
// ========================================
function clampVolume() {
    const liquidVolL = state.liquidMol * LIQUID_VOL_PER_MOL;
    const minVol = liquidVolL + 0.3; // 少なくとも0.3Lは気相のスペースを残す
    
    // スライダーの設定にも反映
    UI.vol.min = minVol.toFixed(2);

    if (state.containerVol < minVol) {
        state.containerVol = minVol;
        UI.vol.value = minVol;
        UI.volDisp.textContent = `${state.containerVol.toFixed(1)} L`;
    }
}

// ========================================
// 物理演算
// ========================================
function calculatePhysics(dt) {
    const pVapMmHg = Math.pow(10, currentSubstance.A - (currentSubstance.B / (currentSubstance.C + state.tempC)));
    state.vaporPressurePa = pVapMmHg * 133.322;

    const liquidVolL = state.liquidMol * LIQUID_VOL_PER_MOL; 
    let gasVolL = state.containerVol - liquidVolL;
    if (gasVolL < 0.1) gasVolL = 0.1;

    let targetGasMol = (state.vaporPressurePa / 1000) * gasVolL / (R_kPa * state.tempK);
    if (targetGasMol > TOTAL_MOL) targetGasMol = TOTAL_MOL;

    const reactionRate = 2.0 * Math.exp(-1500 / state.tempK) * state.timeSpeed;
    const diffMol = targetGasMol - state.gasMol;
    
    const deltaMol = diffMol * reactionRate * (dt * 60);
    state.gasMol += deltaMol;
    state.liquidMol = TOTAL_MOL - state.gasMol;

    if (state.gasMol < 0) { state.gasMol = 0; state.liquidMol = TOTAL_MOL; }
    if (state.liquidMol < 0) { state.liquidMol = 0; state.gasMol = TOTAL_MOL; }

    state.currentPressurePa = (state.gasMol * R_kPa * state.tempK / gasVolL) * 1000;
}

// ========================================
// UI・描画
// ========================================
function updateUI() {
    UI.vapPresDisp.textContent = `${(state.vaporPressurePa / 100).toFixed(1)} hPa`;
    UI.curPresDisp.textContent = `${(state.currentPressurePa / 100).toFixed(1)} hPa`;
    UI.molDisp.textContent = `${state.gasMol.toFixed(1)} / ${state.liquidMol.toFixed(1)} mol`;

    const diff = state.vaporPressurePa - state.currentPressurePa;
    const threshold = state.vaporPressurePa * 0.01;

    if (state.liquidMol < 0.1) {
        UI.statusBadge.textContent = "気体のみ";
        UI.statusBadge.className = "status-badge status-eq";
    } else if (Math.abs(diff) < threshold) {
        UI.statusBadge.textContent = "気液平衡";
        UI.statusBadge.className = "status-badge status-eq";
    } else if (diff > 0) {
        UI.statusBadge.textContent = "蒸発進行中 ↑";
        UI.statusBadge.className = "status-badge status-evap";
    } else {
        UI.statusBadge.textContent = "凝縮進行中 ↓";
        UI.statusBadge.className = "status-badge status-cond";
    }
}

function drawCanvas() {
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

    // 液面とピストンの高さをスケール(MAX_VOL = CANVAS_H)に完全一致させる
    const liquidVolL = state.liquidMol * LIQUID_VOL_PER_MOL;
    const liquidH = CANVAS_H * (liquidVolL / MAX_VOL);
    const liquidY = CANVAS_H - liquidH;
    
    // ピストン下面のY座標
    const pistonBottom = CANVAS_H - (CANVAS_H * (state.containerVol / MAX_VOL));

    // 気体領域
    ctx.fillStyle = "rgba(255, 255, 255, 0.02)";
    ctx.fillRect(0, pistonBottom, CANVAS_W, liquidY - pistonBottom);

    // 液体領域
    const grad = ctx.createLinearGradient(0, liquidY, 0, CANVAS_H);
    grad.addColorStop(0, currentSubstance.colorL);
    grad.addColorStop(1, currentSubstance.colorD);
    ctx.fillStyle = grad;
    ctx.fillRect(0, liquidY, CANVAS_W, liquidH);
    
    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
    ctx.fillRect(0, liquidY, CANVAS_W, 2);

    // パーティクル
    particles.forEach(p => p.draw(ctx, currentSubstance.colorL));

    // ピストン描画（下から上にPISTON_H分描く）
    const pistonTop = pistonBottom - PISTON_H;
    const pistonGrad = ctx.createLinearGradient(0, pistonTop, 0, pistonBottom);
    pistonGrad.addColorStop(0, "#E5E5EA");
    pistonGrad.addColorStop(1, "#8E8E93");
    
    ctx.fillStyle = pistonGrad;
    ctx.beginPath();
    ctx.roundRect(4, pistonTop, CANVAS_W - 8, PISTON_H, 12);
    ctx.fill();

    // シャフト
    ctx.fillStyle = "#D1D1D6";
    ctx.fillRect(CANVAS_W/2 - 12, 0, 24, pistonTop);
}

// ========================================
// メインループ
// ========================================
let lastTime = performance.now();

function loop(currentTime) {
    const dt = Math.min((currentTime - lastTime) / 1000, 0.05);
    lastTime = currentTime;

    // スライダー位置の制限を常に監視
    clampVolume();

    syncParticles();
    calculatePhysics(dt);
    
    // パーティクル用に最新の座標を計算
    const liquidVolL = state.liquidMol * LIQUID_VOL_PER_MOL;
    const liquidY = CANVAS_H - (CANVAS_H * (liquidVolL / MAX_VOL));
    const pistonBottom = CANVAS_H - (CANVAS_H * (state.containerVol / MAX_VOL));
    
    particles.forEach(p => p.update(dt, pistonBottom, liquidY));

    drawCanvas();
    updateUI();

    requestAnimationFrame(loop);
}

// ========================================
// イベントリスナー
// ========================================
UI.substance.addEventListener('change', (e) => {
    currentSubstance = SUBSTANCES[e.target.value];
});

UI.temp.addEventListener('input', (e) => {
    state.tempC = parseFloat(e.target.value);
    state.tempK = state.tempC + 273.15;
    UI.tempDisp.textContent = `${state.tempC} °C`;
});

UI.vol.addEventListener('input', (e) => {
    state.containerVol = parseFloat(e.target.value);
    UI.volDisp.textContent = `${state.containerVol.toFixed(1)} L`;
});

UI.speed.addEventListener('input', (e) => {
    state.timeSpeed = parseFloat(e.target.value);
    UI.speedDisp.textContent = `${state.timeSpeed.toFixed(1)}x`;
});

requestAnimationFrame(loop);

</script>
